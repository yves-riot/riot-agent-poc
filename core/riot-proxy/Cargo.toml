[package]
name = "riot-proxy"
description = "Local TLS-intercepting proxy for the Riot agent: redacts text and gates file uploads in requests to the protected AI services"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "http1", "http2"] }
multer = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = { workspace = true, features = ["http2"] }
rustls = "0.23"
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
time = "0.3"
tokio = { workspace = true }
tokio-rustls = "0.26"
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["http2", "multipart"] }
