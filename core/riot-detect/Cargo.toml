[package]
name = "riot-detect"
description = "Sensitive-data detection for the Riot agent: the extension's TS engine on embedded QuickJS, plus native pdf text extraction"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rquickjs = { version = "0.14", features = ["array-buffer", "classes"] }
pdf-extract = "0.12"
lopdf = { version = "0.42", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
