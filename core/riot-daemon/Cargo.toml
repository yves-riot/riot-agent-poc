[package]
name = "riot-daemon"
description = "The Riot agent daemon: hosts the detection engine, talks to parrot, serves local clients"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "riot-daemon"
path = "src/main.rs"

[[bin]]
name = "riotctl"
path = "src/bin/riotctl.rs"

# parrot's agent API, stubbed, for local runs (dev/run-dev.sh, with --dev) and tests.
[[bin]]
name = "riot-stub-parrot"
path = "src/bin/stub_parrot.rs"

[features]
# Logs redacted and restored values: development builds only, never one that ships.
debug-redaction = []

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hostname = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
libc = { workspace = true }
plist = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
riot-api = { workspace = true }
riot-detect = { workspace = true }
riot-ipc = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
zstd = { workspace = true }
flate2 = { workspace = true }
