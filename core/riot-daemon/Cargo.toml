[package]
name = "riot-daemon"
description = "The Riot agent daemon: hosts the detection engine, talks to parrot, serves local clients"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "riot-daemon"
path = "src/main.rs"

[[bin]]
name = "riotctl"
path = "src/bin/riotctl.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
hostname = { workspace = true }
libc = { workspace = true }
plist = { workspace = true }
riot-api = { workspace = true }
riot-detect = { workspace = true }
riot-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
